[package]
name = "tpt-config-engine"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
# Pro-only engine capabilities (batch validation, custom rule authoring).
# The free engine compiles without it.
pro = []

[dependencies]
# Base crate: YAML 1.1/1.2 parsing (multi-document, anchors/aliases) into an
# arena node model, zero deps, no_std-capable — wasm-safe.
tpt-yaml-core = { path = "D:/Programming/1PRODUCTION/Open Source/tpt-yaml/crates/tpt-yaml-core" }
# JSON parsing (there is no tpt-json general parser in tpt-data-parsers —
# its JSON crate is streaming JSONL only).
serde_json = "1"
# Pure Rust, no-std-compatible core; wasm32-safe. Used for the `matches`
# rule operators and the Terraform line-lint patterns. `unicode-perl` keeps
# `\s`/`\w`/`\d` working in user-authored rule patterns without pulling the
# full Unicode tables.
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
