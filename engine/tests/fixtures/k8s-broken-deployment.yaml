# Deliberately broken: missing spec.selector.matchLabels (required in
# apps/v1), replicas is a string, the second container has no image, the
# first image floats on :latest, and metadata.name is not DNS-1123 safe.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: Payments_API!!
  labels:
    app: payments-api
spec:
  replicas: "three"
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      containers:
        - name: api
          image: registry.internal/payments-api:latest
        - name: sidecar
