[package]
name = "tpt-app-ci-config-validator"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
members = [".", "engine", "desktop", "cli"]
resolver = "2"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Pro edition (paid desktop build): batch/directory validation, custom rule
# authoring, and the team-license gates. The free WASM build compiles without
# it; `--features pro` is Pro.
pro = ["tpt-config-engine/pro"]

[dependencies]
tpt-appfront-core = { path = "D:/Programming/1PRODUCTION/Open Source/tpt-appfront/crates/tpt-appfront-core" }
tpt-appfront-dom = { path = "D:/Programming/1PRODUCTION/Open Source/tpt-appfront/crates/tpt-appfront-dom" }
tpt-config-engine = { path = "engine" }
# Pinned to the installed wasm-bindgen CLI version — the CLI rejects wasm
# built against a different schema version. Bump both together.
wasm-bindgen = "=0.2.128"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Location",
    "Element",
    "Node",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "HtmlSelectElement",
    "HtmlHeadElement",
    "CssStyleDeclaration",
    "HtmlCollection",
    "Event",
    "EventTarget",
    "Blob",
    "Url",
    "HtmlAnchorElement",
    "DomRect",
    "File",
    "FileList",
    "FileReader",
    "MouseEvent",
] }
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
